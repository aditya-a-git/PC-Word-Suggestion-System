name: .NET build and tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore solution
        run: dotnet restore .\PCWord.sln

      - name: Build solution
        run: dotnet build .\PCWord.sln --configuration Release --no-restore

      - name: Run tests
        run: dotnet test .\PCWord.sln --configuration Release --no-build --logger "console;verbosity=normal"

      - name: Configure native TSF probe
        run: cmake -S .\tools\PCWord.TsfProbe -B .\tools\PCWord.TsfProbe\build-ci -A x64

      - name: Build native TSF probe
        run: cmake --build .\tools\PCWord.TsfProbe\build-ci --config Release

      - name: Run native policy tests
        run: ctest --test-dir .\\tools\\PCWord.TsfProbe\\build-ci -C Release --output-on-failure

      - name: Publish controlled-editor evaluation build
        shell: pwsh
        run: |
          $publishDir = Join-Path $env:RUNNER_TEMP "PCWord-evaluation"
          $archive = Join-Path $env:RUNNER_TEMP "PCWord-controlled-editor-evaluation-win-x64.zip"
          dotnet publish .\\src\\PCWord.Stage0\\PCWord.Stage0.csproj --configuration Release --runtime win-x64 --self-contained true --output $publishDir
          if ($LASTEXITCODE -ne 0) { throw "Evaluation publish failed." }
          if (-not (Test-Path (Join-Path $publishDir "PCWord.Stage0.exe"))) { throw "Expected application executable was not published." }
          if (-not (Test-Path (Join-Path $publishDir "Dictionary\\esdb-en-US.tsv"))) { throw "Required dictionary asset is missing from the evaluation package." }
          @"
          PCWord controlled-editor evaluation build.
          This is not a production release and does not provide system-wide suggestions.
          No installer or uninstaller is included. Use synthetic text only.
          "@ | Set-Content -Path (Join-Path $publishDir "EVALUATION-NOTICE.txt") -Encoding utf8
          $manifest = Get-ChildItem -Path $publishDir -File -Recurse | Sort-Object FullName | ForEach-Object {
            $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $_.FullName).Hash
            "$hash *$($_.FullName.Substring($publishDir.Length + 1))"
          }
          $manifest | Set-Content -Path (Join-Path $publishDir "SHA256SUMS.txt") -Encoding ascii
          Compress-Archive -Path (Join-Path $publishDir "*") -DestinationPath $archive -Force
          $archiveHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $archive).Hash
          "Evaluation ZIP SHA-256: `$archiveHash" | Add-Content -Path $env:GITHUB_STEP_SUMMARY
          "Artifact: commit $env:GITHUB_SHA (win-x64)" | Add-Content -Path $env:GITHUB_STEP_SUMMARY

      - name: Upload controlled-editor evaluation build
        uses: actions/upload-artifact@v4
        with:
          name: PCWord-controlled-editor-evaluation-win-x64-${{ github.sha }}
          path: ${{ runner.temp }}\\PCWord-controlled-editor-evaluation-win-x64.zip
          if-no-files-found: error
          retention-days: 7

      - name: Publish native TSF probe artifact
        uses: actions/upload-artifact@v4
        with:
          name: diagnostic-PCWordTsfProbe-win-x64
          path: .\tools\PCWord.TsfProbe\build-ci\Release\PCWordTsfProbe.dll
          if-no-files-found: error
          retention-days: 7
